name: Playwright browsers
description: >
  Verifies that the Playwright browsers are preinstalled. Every browser job runs in the pinned
  mcr.microsoft.com/playwright container (browsers and system libraries baked in), so no apt step
  ever runs (#99). Fails loudly if a job forgot the container instead of falling back to apt.
inputs:
  browsers:
    description: Space-separated engines, e.g. "chromium firefox webkit".
    required: true
runs:
  using: composite
  steps:
    - name: Verify preinstalled browsers (no install, no apt)
      shell: bash
      working-directory: packages/testing
      env:
        BROWSERS: ${{ inputs.browsers }}
      run: |
        set -eu
        path="${PLAYWRIGHT_BROWSERS_PATH:-}"
        if [ -z "$path" ] || [ ! -d "$path" ]; then
          echo "::error::PLAYWRIGHT_BROWSERS_PATH is unset or missing. Run this job in the mcr.microsoft.com/playwright container (#99)."
          exit 1
        fi
        ls "$path"
        for b in $BROWSERS; do
          ls "$path" | grep -q "^$b" || { echo "::error::$b is not preinstalled in $path"; exit 1; }
        done
        echo "version=$(node -p "require('@playwright/test/package.json').version")"
