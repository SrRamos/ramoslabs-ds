name: Playwright browsers
description: >
  Installs Playwright browsers with system dependencies, cached on the pinned Playwright version.
  On a cache hit the system libraries are still installed (they live outside the cache).
inputs:
  browsers:
    description: Space-separated engines, e.g. "chromium firefox webkit".
    required: true
runs:
  using: composite
  steps:
    - name: Resolve Playwright version
      id: pw
      shell: bash
      working-directory: packages/testing
      run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
    # An unreachable apt mirror (seen with azure.archive.ubuntu.com) otherwise hangs
    # `install --with-deps` / `install-deps` until the job timeout cancels it; fail fast and retry.
    - name: Bound apt network waits
      shell: bash
      run: |
        printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "3";\n' \
          | sudo tee /etc/apt/apt.conf.d/99-ci-timeouts > /dev/null
    - name: Cache browsers
      id: cache
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.version }}-${{ inputs.browsers }}
    - name: Install browsers and system dependencies
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      working-directory: packages/testing
      run: |
        for i in 1 2 3; do timeout 300 bunx playwright install --with-deps ${{ inputs.browsers }} && exit 0; echo "attempt $i failed"; sleep 10; done
        exit 1
    - name: Install system dependencies (browsers restored from cache)
      if: steps.cache.outputs.cache-hit == 'true'
      shell: bash
      working-directory: packages/testing
      run: |
        for i in 1 2 3; do timeout 300 bunx playwright install-deps ${{ inputs.browsers }} && exit 0; echo "attempt $i failed"; sleep 10; done
        exit 1
