name: Setup
description: Bun 1.3.5, Node 22 and a frozen-lockfile install (shared by every job).
runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.5
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
