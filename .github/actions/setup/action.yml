name: Setup
description: Bun 1.3.5, Node 22 and a frozen-lockfile install (shared by every job).
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    # oven-sh/setup-bun extracts a zip and needs `unzip`, which the Playwright container lacks
    # (installing it would need apt, #99). There bun comes from npm at the same pinned version.
    - name: Detect unzip
      id: unzip
      shell: bash
      run: echo "present=$(command -v unzip >/dev/null && echo true || echo false)" >> "$GITHUB_OUTPUT"
    - uses: oven-sh/setup-bun@v2
      if: steps.unzip.outputs.present == 'true'
      with:
        bun-version: 1.3.5
    - name: Bun 1.3.5 from npm (no unzip)
      if: steps.unzip.outputs.present != 'true'
      shell: bash
      run: npm install -g bun@1.3.5 && bun --version
    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile
