# CI gate. The root `gate` script in package.json is the local mirror; here it is split into
# parallel jobs so a failure names the check and the wall time is the slowest job, not the sum.
# No step tolerates failure and nothing is retried: flaky tests are failures. Browser suites live
# in e2e.yml (same triggers). The `ci` job at the end is the single required status.
name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # Lint covers apps/site worker/ and agentic/ too (apps/site `eslint .`).
      - name: Lint
        run: bun run lint
      - name: Format check
        run: bun run format:check
      - name: Typecheck
        run: bun run typecheck
      - name: Contracts check
        run: bun run contracts:check
      - name: Contract lint and deny-list scan
        run: bun run contract:lint
      - name: Evidence check (W1-317)
        run: bun run evidence:check
      - name: Honesty scan (W1-319)
        run: bun run honesty:check
      - name: Skip without reason or issue
        run: bun run skips:check

  test:
    name: Unit, SSR, contrast
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - uses: ./.github/actions/browsers
        with:
          browsers: chromium # css probe fixtures (W1-204) drive Chromium
      - name: Test (all vitest projects, includes SSR and contrast)
        run: bun run test
      # Named again so a failure in these two is visible at a glance; they already ran above.
      - name: SSR parity
        run: bunx vitest run ssr
        working-directory: packages/testing
      - name: Contrast matrix
        run: bunx vitest run contrast
        working-directory: packages/testing

  size-and-drift:
    name: Size, registry drift
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build
        run: bun run build
      - name: Size budget (ADR-011)
        run: bun run size
      - name: Registry drift (built and committed registry.json vs contracts)
        run: bun run registry:check
      - name: Committed generated files are unchanged by the build
        run: git diff --exit-code -- registry.json llms.txt llms-full.txt

  ci:
    name: CI
    if: always()
    needs: [static, test, size-and-drift]
    runs-on: ubuntu-24.04
    steps:
      - name: Every job succeeded
        run: |
          echo '${{ toJSON(needs) }}'
          test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}" = "false"
