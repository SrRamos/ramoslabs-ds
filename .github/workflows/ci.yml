# CI gate. This workflow mirrors the root `gate` script in package.json:
# each check runs the same bun script as its own named step, so a failure
# points directly at the check that broke. No step tolerates failure and
# nothing is retried; flaky tests are failures.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Size budget
        run: bun run size

      - name: Contracts check
        run: bun run contracts:check

      - name: Evidence check
        run: bun run evidence:check
