<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auth: pass</title>
<link rel="stylesheet" href="/tokens.css">
<link rel="stylesheet" href="/sj.css">
</head>
<body>
<main>
<h1>Sign in</h1>
<form onsubmit="return false">
<label for="u">Email</label>
<input id="u" type="email" autocomplete="username">
<label for="p">Password</label>
<input id="p" type="password" autocomplete="current-password" >
<label for="otp">Code</label>
<input id="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]*">
<button data-part="trigger" type="submit">Sign in</button>
</form>

</main>
</body>
</html>
